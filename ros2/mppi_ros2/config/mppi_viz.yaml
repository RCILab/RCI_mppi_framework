mppi_viz_node:
  ros__parameters:
    viz_data_topic: /mppi/viz_data
    viz_topic: /mppi/viz
    viz_frame_id: panda_link0
    state_topic: /robot/joint_states

    nq: 7
    nu: 7
    horizon: 30
    dt: 0.02

    viz_line_width_opt: 0.015
    viz_line_width_samp: 0.002
    viz_alpha_samp: 0.15
    viz_time_stride: 2

    device: cuda

    # 4. Interactive marker -> Goal publishing
    goal_topic: /mppi/goal
    im_server_name: ee_goal_marker
    im_frame_id: panda_link0
    im_scale: 0.2
